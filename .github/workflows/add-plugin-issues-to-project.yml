name: Add plugin issues to project

on:
  schedule:
    # 毎時17分（毎正時の混雑を避ける）
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'この日時以降に作成されたイシューを対象にする（例: 2026-10-01T00:00:00Z）。空なら3時間前'
        required: false
        default: ''
      dry_run:
        description: '追加せずに対象だけ表示する'
        type: boolean
        default: false

concurrency:
  group: add-plugin-issues-to-project

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add new issues to project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          SINCE: ${{ inputs.since }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          [ -z "$SINCE" ] && unset SINCE
          ./scripts/add-plugin-issues-to-project.sh
